name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac-app:
    name: Mac app
    # Chip's MacBook, registered as a repo runner. The hosted macos images lag
    # the SDK the app is actually used on, and a menubar app's layout comes
    # from the SDK it was built against, so building on a current Mac is not a
    # speed optimisation, it is what makes the shipped window match the one we
    # test. Falls back to nothing if the machine is asleep: the job queues.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: mac
        run: swift test

      - name: Build
        working-directory: mac
        run: ./build.sh

      - name: Package
        working-directory: mac
        run: ./package-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AgentInbox-dmg
          path: mac/build/*.dmg

  shell:
    name: Shell senders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: for f in *.sh mac/*.sh; do bash -n "$f"; done

      - name: Lint
        run: shellcheck --severity=warning *.sh mac/*.sh

      - name: Sender tests
        run: ./test-notify.sh

  notify:
    name: Notify on failure
    needs: [mac-app, shell]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CICD }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          curl -m 10 -s -H 'Content-Type: application/json' -d @- "$WEBHOOK" <<JSON
          {"embeds":[{"title":"agent-inbox CI failed","color":15158332,
          "description":"[${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) failed on \`${GITHUB_SHA:0:7}\`"}]}
          JSON
