name: Release

# Tag a version to publish a signed, notarized DMG:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets:
#   MACOS_CERTIFICATE          base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD password for that .p12
#   MACOS_SIGN_IDENTITY        e.g. "Developer ID Application: You (TEAMID)"
#   APPLE_API_KEY              the App Store Connect API .p8, base64 encoded
#   APPLE_API_KEY_ID           that key's Key ID
#   APPLE_API_ISSUER           that key's Issuer ID (a UUID)
#   SPARKLE_PRIVATE_KEY        the Sparkle EdDSA private key, for the appcast
#
# Without the signing secrets the job still builds and publishes an unsigned
# DMG, which is useful for pre-releases but shows a Gatekeeper warning.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # The tag is the single source of the version. Committing a VERSION bump
      # separately means the two can disagree, and a mismatch is invisible:
      # the appcast advertises whatever VERSION said, so the release notes and
      # the update feed quietly describe different builds.
      - name: Take the version from the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          echo "$TAG" > mac/VERSION
          echo "building $TAG"

      - name: Test
        working-directory: mac
        run: swift test

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Unpack the notarization key
        if: env.APPLE_API_KEY != ''
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Unpack the Sparkle signing key
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '\n' > "$RUNNER_TEMP/sparkle.key"
          chmod 600 "$RUNNER_TEMP/sparkle.key"

      - name: Build and package
        working-directory: mac
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' && format('{0}/sparkle.key', runner.temp) || '' }}
        run: ./package-dmg.sh

      - name: Remove the signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: mac/build/*.dmg
          generate_release_notes: true

      # The update feed the shipped app polls, so it needs a stable URL.
      # Committing it to main is enough: the app checks the EdDSA signature
      # against its own Info.plist, so the host does not have to be trusted.
      # Runs after the release so the URLs in the feed already resolve.
      - name: Publish the appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          [ -f appcast.xml ] || { echo "no appcast was generated" >&2; exit 1; }
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged"
          else
            git commit -m "Publish appcast for ${GITHUB_REF_NAME}"
            git push origin main
          fi
